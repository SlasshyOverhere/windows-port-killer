name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build/Release/PortKiller.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Report version
        shell: pwsh
        run: |
          Write-Host ((Get-Content version.txt -Raw).Trim())
          & build/Release/PortKiller.exe --version | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: PortKiller-win-x64
          path: build/Release/PortKiller.exe
          if-no-files-found: error
